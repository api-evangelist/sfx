description: SFX (SFX Entertainment, now operating as LiveStyle, Inc) is a Beverly
  Hills based global live-events and electronic dance music company. Originally founded
  by Robert F.X. Sillerman as a roll-up of EDM festival and event brands, the company
  reorganized as LiveStyle and continues to produce live music experiences, festivals,
  and fan events under the banner "For the Love of Music." It was surfaced as a
  portfolio-linked company and added to the API Evangelist network for enrichment.
  The company presents a corporate marketing web presence and publishes no public
  developer, API, or technical integration surface at this time.
